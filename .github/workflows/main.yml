name: Android - ClearCut completo no Monstro

on:
  push:
    branches: [main, principal, fix/editor-funcional]
  pull_request:
    branches: [fix/editor-funcional]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monstro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: monstro
    steps:
      - uses: actions/checkout@v4
        with:
          path: monstro
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Preparar Firebase do Monstro
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            mkdir -p app
            echo "$FIREBASE_CONFIG" | base64 --decode > app/google-services.json
          fi
      - name: Detectar importação inicial
        id: source
        run: |
          if [ -f CLEARCUT_FULL_SOURCE.json ]; then
            echo 'import=false' >> "$GITHUB_OUTPUT"
          else
            echo 'import=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.source.outputs.import == 'true'
        with:
          repository: SysAdminDoc/ClearCut
          ref: 8a18de40dd474bbc01f43fd5a6d8e1356ce5600f
          path: clearcut
          persist-credentials: false
      - name: Integrar código completo e adaptadores Monstro
        if: steps.source.outputs.import == 'true'
        run: |
          python3 .integration/vendor_clearcut.py --root . --upstream ../clearcut
          git apply .integration/monstro.patch
          git diff --check
          git config user.name 'Monstro Integration'
          git config user.email 'monstro-integration@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrar motor completo ClearCut, efeitos Monstro e migração de projetos'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Ajustar identidade e contratos do fork Monstro
        if: hashFiles('monstro/.integration/apply-fork-contracts') != ''
        run: |
          python3 .integration/repair_source_paths.py
          git apply .integration/fork-contracts.patch
          python3 scripts/validate_package_identity.py
          python3 scripts/validate_android_audio_api_policy.py
          python3 scripts/generate_capability_registry.py --check
          git diff --check
          git config user.name 'Monstro Integration'
          git config user.email 'monstro-integration@users.noreply.github.com'
          git add -u -- . ':!app/google-services.json'
          git add app/src/qa/res/xml/shortcuts.xml app/src/streaming/res/xml/shortcuts.xml
          git rm .integration/apply-fork-contracts
          git commit -m 'fix: compatibilidade SDK 37.0, efeitos, atalhos e contratos Monstro'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Instalar SDK do motor completo
        run: |
          sdkmanager --channel=3 --list > /tmp/monstro-sdk-packages.txt
          python3 -c "from pathlib import Path;print('\\n'.join(x for x in Path('/tmp/monstro-sdk-packages.txt').read_text().splitlines() if 'platforms;android' in x or 'build-tools;3' in x))"
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Registrar dependências novas da integração
        if: hashFiles('monstro/.integration/refresh-dependency-lock') != ''
        run: |
          cp gradle/verification-metadata.xml /tmp/monstro-verification-before.xml
          set +e
          ./gradlew :app:assembleDebug :app:assembleQa :app:assembleQaAndroidTest :app:testQaUnitTest :app:lintQa --write-verification-metadata sha256 --continue --no-daemon --stacktrace
          result=$?
          set -e
          python3 .integration/check_dependency_lock.py /tmp/monstro-verification-before.xml gradle/verification-metadata.xml
          git config user.name 'Monstro Integration'
          git config user.email 'monstro-integration@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git rm .integration/refresh-dependency-lock
          git commit -m 'build: registrar checksums das dependências adicionadas ao Monstro'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          exit "$result"
      - name: Compilar aplicação e testes de integração
        run: ./gradlew :app:assembleDebug :app:assembleQa :app:assembleQaAndroidTest --no-daemon --stacktrace
      - name: Testes unitários e lint
        id: quality
        continue-on-error: true
        run: ./gradlew :app:testQaUnitTest :app:lintQa --no-daemon --stacktrace --continue
      - name: Publicar diagnóstico dos testes unitários
        uses: actions/upload-artifact@v4
        if: always() && steps.quality.outcome != 'skipped'
        with:
          name: relatorios-unidade
          path: |
            monstro/app/build/test-results/testQaUnitTest
            monstro/app/build/reports/lint-results-qa.*
      - name: Validar efeitos Monstro por pixels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri
          python3 legacy/monstro-v18/tools/check_shaders.py
      - name: Preparar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testes Android do motor integrado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: monstro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedQaAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MonstroV18-ClearCut-APK
          path: monstro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-integracao-completa
          path: |
            monstro/build/reports
            monstro/app/build/reports
            monstro/app/build/test-results
      - name: Exigir aprovação dos testes unitários e lint
        if: always() && steps.quality.outcome == 'failure'
        run: exit 1
