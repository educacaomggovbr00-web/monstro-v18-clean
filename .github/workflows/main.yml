name: Android - testar e gerar APK

on:
  push:
    branches: [main, principal, fix/editor-funcional]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Firebase AI Logic
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Firebase configurado pelo segredo do GitHub."
          elif [ -f app/google-services.json ]; then
            echo "Firebase configurado pelo app/google-services.json do repositório."
          else
            echo "::error::Firebase não configurado: app/google-services.json ausente."
            exit 1
          fi
          grep -q '"project_id": "monstro-v18-9a791"' app/google-services.json
          grep -q '"package_name": "com.monstro.v18.studio"' app/google-services.json
          echo "Configuração Firebase do Monstro V18 validada."

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Preparar fala sintética para testar legendas automáticas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg libegl1 libgl1 libgl1-mesa-dri
          espeak-ng -v pt-br -s 130 -w /tmp/voice.wav 'Olá mundo. Este é um vídeo de teste. Vamos fazer uma legenda com palavras e música. O editor de vídeo está funcionando.'
          ffmpeg -y -f lavfi -i color=c=black:s=160x90:r=15 -i /tmp/voice.wav -c:v libx264 -c:a aac -shortest app/src/androidTest/assets/voice.mp4
      - name: Verificar pixels dos 1000 presets OpenGL
        run: python3 tools/check_shaders.py
      - name: Testar e compilar o código do repositório
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Gerar APK de produção assinado (quando configurado)
        env:
          MONSTRO_RELEASE_KEYSTORE_B64: ${{ secrets.MONSTRO_RELEASE_KEYSTORE_B64 }}
          MONSTRO_RELEASE_STORE_PASSWORD: ${{ secrets.MONSTRO_RELEASE_STORE_PASSWORD }}
          MONSTRO_RELEASE_KEY_ALIAS: ${{ secrets.MONSTRO_RELEASE_KEY_ALIAS }}
          MONSTRO_RELEASE_KEY_PASSWORD: ${{ secrets.MONSTRO_RELEASE_KEY_PASSWORD }}
          MONSTRO_RELEASE_KEYSTORE: ${{ runner.temp }}/monstro-v18-release.jks
        run: |
          if [ -n "$MONSTRO_RELEASE_KEYSTORE_B64" ] &&
             [ -n "$MONSTRO_RELEASE_STORE_PASSWORD" ] &&
             [ -n "$MONSTRO_RELEASE_KEY_ALIAS" ] &&
             [ -n "$MONSTRO_RELEASE_KEY_PASSWORD" ]; then
            echo "$MONSTRO_RELEASE_KEYSTORE_B64" | base64 --decode > "$MONSTRO_RELEASE_KEYSTORE"
            keytool -list -keystore "$MONSTRO_RELEASE_KEYSTORE" -storepass "$MONSTRO_RELEASE_STORE_PASSWORD" -alias "$MONSTRO_RELEASE_KEY_ALIAS" >/dev/null
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "APK release assinado gerado."
          else
            echo "Segredos de assinatura ainda não configurados; pulando APK release."
          fi

      - name: Habilitar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exportar vídeo com todos os efeitos no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -c 'gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace; result=$?; mkdir -p app/build/reports/lyrics-debug; adb pull /sdcard/Download/monstro-lyrics-debug.mp4 app/build/reports/lyrics-debug/; adb pull /sdcard/Pictures/MonstroTests/studio-ui.png app/build/reports/lyrics-debug/studio-ui.png; adb logcat -d -s MonstroLyrics:I MonstroSpeed:I > app/build/reports/lyrics-debug/timing.txt; exit "$result"'
      - uses: actions/upload-artifact@v4
        with:
          name: MonstroV18-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MonstroV18-APK-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: app/build/reports/
