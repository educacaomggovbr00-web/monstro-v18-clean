name: Android - testar e gerar APK

on:
  push:
    branches: [main, principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Preparar fala sintética para testar legendas automáticas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -v pt-br -s 130 -w app/src/androidTest/assets/voice.wav 'Olá mundo. Este é um vídeo de teste. Vamos fazer uma legenda com palavras e música. O editor de vídeo está funcionando.'
      - name: Testar e compilar o código do repositório
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Habilitar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exportar vídeo com todos os efeitos no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -c 'gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace; result=$?; mkdir -p app/build/reports/lyrics-debug; adb pull /sdcard/Download/monstro-lyrics-debug.mp4 app/build/reports/lyrics-debug/; adb exec-out run-as com.monstro.v18.studio cat files/studio-ui.png > app/build/reports/lyrics-debug/studio-ui.png; adb logcat -d -s MonstroLyrics:I > app/build/reports/lyrics-debug/timing.txt; exit "$result"' 
      - uses: actions/upload-artifact@v4
        with:
          name: MonstroV18-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: app/build/reports/
